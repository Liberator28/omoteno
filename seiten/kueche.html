/* ╔═══ VOLLBILD · GETEILTER BLOCK · ANFANG ════════════════════════╗
   ║ Wortgleich in seiten/admin.html und seiten/kueche.html.        ║
   ║ pruef-vollbild.js vergleicht beide Zeichen für Zeichen. Wer    ║
   ║ hier etwas ändert, ändert es dort auch.                       ║
   ║                                                               ║
   ║ Der Block ist rein: Er kennt nur die Kennung seines Knopfes    ║
   ║ und eine Funktion zum Merken. Nichts aus der Umgebung.         ║
   ╚═══════════════════════════════════════════════════════════════╝ */
function vollbildAn(){ return !!document.fullscreenElement; }

/* documentElement, nicht ein Teilbaum: Sonst verschwindet alles, was
   außerhalb liegt — Meldungen, Sperrschicht, Überlagerungen. Sie
   wären im Vollbild schlicht nicht gezeichnet. */
function vollbildRein(){
  var el = document.documentElement;
  if(!el.requestFullscreen) return Promise.reject();
  return el.requestFullscreen().catch(function(){});
}
function vollbildRaus(){
  if(document.exitFullscreen) return document.exitFullscreen().catch(function(){});
}

/* Der Knopf muss WISSEN, ob er an ist. Ohne das ist er ein Schalter
   ohne Stellung: Chrome verlässt den Vollbildmodus bei Escape, und
   die Seite bekommt den Tastendruck trotzdem — ein Druck schließt
   also den Dialog UND wirft heraus. Verhindern kann das keine Seite.
   Was sie kann: sofort zeigen, dass sie draußen ist, damit der
   Rückweg einen Griff entfernt bleibt. */
function vollbildKnopfStellen(kennung){
  var k = document.getElementById(kennung);
  if(!k) return;
  var an = vollbildAn();
  k.setAttribute("aria-pressed", String(an));
  k.setAttribute("aria-label", an ? "Vollbild verlassen" : "Vollbild");
  k.classList.toggle("an", an);
}

/* Ein Schirm, der morgens eingeschaltet wird, kann NICHT von selbst
   ins Vollbild — der Browser verlangt dafür eine Geste, und das lässt
   sich nicht umgehen. Was geht: sich die Absicht merken und die
   ERSTE beste Geste dafür nehmen. Ein Handgriff statt fünf.

   once:true an jedem Horcher, und alle drei werden beim ersten
   Zugriff abgeräumt — sonst springt die Seite später bei jedem Klick
   erneut hinein, wenn der Nutzer bewusst herausgegangen ist. */
function vollbildAufWunsch(kennung, willVollbild, merken){
  var knopf = document.getElementById(kennung);

  /* Der Unterschied, an dem alles haengt: Ist der Nutzer ABSICHTLICH
     heraus, oder hat ihn etwas hinausgeworfen?

     Escape, die Systemgeste und ein Wechsel der Anwendung beenden den
     Vollbildmodus, ohne dass jemand das wollte — dort soll er
     zurueckkommen. Wer dagegen den Knopf drueckt, will heraus, und
     dann waere ein erneutes Hineinspringen beim naechsten Tipp ein
     Kampf gegen den Nutzer. Genau davor warnte der Kommentar der
     ersten Fassung; sie loeste es, indem sie sich NIE wieder
     bewaffnete — und damit kam der Vollbildmodus nach einem
     versehentlichen Escape bis zum Neuladen nicht zurueck. */
  var absichtlichRaus = false;

  if(knopf) knopf.addEventListener("click", function(){
    var neu = !vollbildAn();
    absichtlichRaus = !neu;
    /* ABRAEUMEN, wenn er heraus will. Ohne diese Zeile blieb der
       Horcher scharf: Der Knopf ist vom Bewaffnen ausgenommen, also
       kehrte einmal() frueh zurueck OHNE abzuraeumen — und der
       naechste Tipp irgendwo nahm den Nutzer wieder hinein, obwohl
       er gerade selbst herausgegangen war. Gefunden hat es das
       Kuechen-Board, das keinen Scharfschalt-Schirm hat und deshalb
       mit noch scharfem Horcher in die Probe lief. */
    if(absichtlichRaus) abraeumen(); else bewaffnen();
    if(neu) vollbildRein(); else vollbildRaus();
    if(merken) merken(neu);
  });

  /* Die Horcher werden bei jedem Bewaffnen neu gesetzt und beim
     Zugriff wieder abgeraeumt. capture, damit sie auch dann greifen,
     wenn ein Kind das Ereignis stoppt. */
  var arten = ["pointerdown", "keydown", "touchend"];
  var einmal = function(e){
    /* Der Vollbildknopf ist die EINE Geste, die hier nicht zaehlt.

       VORFALL, gemessen von pruef-vollbild.js, sofort nachdem die
       Vorgabe auf "an" ging: Der Horcher laeuft in der Capture-Phase,
       also VOR dem Knopf. Ein Druck auf den Vollbildknopf schaltete
       damit erst ein — und der Knopf rechnete danach
       neu = !vollbildAn() = false und schaltete wieder aus. Der Wirt
       drueckt "Vollbild" und es passiert nichts. Fuenfzehn Proben
       waren rot, und zwar invertiert: erst "an" erwartet und "aus"
       bekommen, dann umgekehrt.

       Der Knopf spricht fuer sich selbst. Jede andere Geste bewaffnet. */
    if(knopf && e && e.target && (e.target === knopf || knopf.contains(e.target))) return;
    abraeumen();
    if(!vollbildAn()) vollbildRein();
  };
  function abraeumen(){
    arten.forEach(function(a){ document.removeEventListener(a, einmal, true); });
  }
  function bewaffnen(){
    if(!document.documentElement.requestFullscreen) return;
    abraeumen();
    arten.forEach(function(a){ document.addEventListener(a, einmal, true); });
  }

  document.addEventListener("fullscreenchange", function(){
    vollbildKnopfStellen(kennung);
    /* Herausgeworfen und nicht selbst gegangen: die naechste Geste
       nimmt uns wieder hinein. EIN Handgriff, nicht fuenf.

       Was hier NICHT steht und nicht stehen kann: ein Verhindern des
       Verlassens. Escape und die Systemgeste sind eine Zusage des
       Browsers an den Nutzer, keine Luecke. Eine Seite, die das
       abfangen koennte, waere eine Falle. */
    /* Nicht willVollbild fragen: Das ist der Wunsch beim START und
       veraltet in der Sekunde, in der der Nutzer den Knopf benutzt.
       absichtlichRaus traegt die aktuelle Wahrheit. */
    if(!vollbildAn() && !absichtlichRaus) bewaffnen();
  });
  vollbildKnopfStellen(kennung);

  if(!willVollbild) return;
  bewaffnen();
}

$('spuren').addEventListener('click', function(ev){
  var b = ev.target.closest('[data-spur]'); if(!b) return;
  EINST.spur = b.dataset.spur;
  einstAnwenden();
});
$('einstKnopf').addEventListener('click', function(){ einstOeffnen($('einstKnopf')); });

function abmelden(){
  sitzung = null; betrieb = null;
  try{ localStorage.removeItem(SPEICHER_SITZUNG); }catch(e){}
  clearInterval(takt);
  $('schirm').hidden = true; $('tor').hidden = false;
}

/* Nur relevant für ein Konto, das mehr als einen Betrieb sieht — bei
   dir also das Master-Konto. Eine normale Servicekraft bekommt von
   der Datenbank ohnehin nur ihren eigenen Betrieb zurück (das regelt
   dieselbe Trennung wie im Bestell-Board), die Auswahl bleibt dann
   versteckt. */
function betriebeWahlZeichnen(){
  var box = $('betriebeWahl');
  if(betriebe.length < 2){ box.hidden = true; box.innerHTML = ""; return; }
  box.innerHTML = betriebe.map(function(b){
    return '<button type="button" data-b="' + h(b.id) + '" class="' +
           (b.id === betrieb.id ? 'an' : '') + '">' + h(b.name || "Betrieb") + '</button>';
  }).join("");
  box.hidden = false;
}
$('betriebeWahl').addEventListener('click', function(ev){
  var k = ev.target.closest('[data-b]'); if(!k) return;
  var neu = betriebe.filter(function(b){ return b.id === k.dataset.b; })[0];
  if(!neu || neu.id === betrieb.id) return;
  betrieb = neu;
  merken("omoteno-kueche-betrieb", betrieb.id);
  $('betriebName').textContent = betrieb.name || "Betrieb";
  betriebeWahlZeichnen();
  /* Beim Wechsel darf nichts vom alten Betrieb hängen bleiben — sonst
     zeigt der Bildschirm für einen Moment fremde Bestellungen. */
  bons = []; gesehen = {}; ersterLauf = true;
  skelettZeichnen();
  ladeKarte().then(aktualisieren);
});

function loslegen(){
  return ladeBetriebe().then(function(liste){
    betriebe = liste || [];
    if(!betriebe.length) throw new Error("Kein Betrieb für dieses Konto hinterlegt.");
    var gemerkt = holen("omoteno-kueche-betrieb");
    betrieb = betriebe.filter(function(b){ return b.id === gemerkt; })[0] || betriebe[0];
    merken("omoteno-kueche-betrieb", betrieb.id);
    $('betriebName').textContent = betrieb.name || "Betrieb";
    betriebeWahlZeichnen();
    $('tor').hidden = true; $('schirm').hidden = false;
    einstAnwenden();
    wachHalten();
    skelettZeichnen();
    return ladeKarte();
  }).then(function(){
    return aktualisieren();
  }).then(function(){
    taktStarten();
    setInterval(ladeKarte, 600000);   /* Karte alle 10 Minuten nachziehen */
  });
}

$('anmeldung').addEventListener('submit', function(ev){
  ev.preventDefault();
  var k = $('torKnopf'), m = $('torMeldung');
  k.disabled = true; k.textContent = "Einen Moment …"; m.textContent = "";
  anmelden($('mail').value.trim(), $('wort').value)
    .then(loslegen)
    .catch(function(e){ m.textContent = e.message; })
    .then(function(){ k.disabled = false; k.textContent = "Anmelden"; });
});

document.addEventListener('visibilitychange', function(){
  if(document.hidden) return;
  wachHalten();
  if(sitzung && betrieb) aktualisieren();
});

uhrStellen();
setInterval(uhrStellen, 15000);

var gespeichert = holen(SPEICHER_EINST);
if(gespeichert) for(var s in gespeichert) if(s in EINST) EINST[s] = gespeichert[s];

/* NACH dem Zurücklesen, nicht davor: Sonst bekäme vollbildAufWunsch
   die Vorgabe false zu sehen und der gemerkte Wunsch bliebe wirkungslos.
   Der Aufruf stand zuerst oben im Startblock — dort lief er 80 Zeilen
   zu früh und tat nichts. */
vollbildAufWunsch('vollbildKnopf', EINST.vollbild, function(an){
  EINST.vollbild = an;
  merken(SPEICHER_EINST, EINST);
});

sitzung = holen(SPEICHER_SITZUNG);
if(sitzung && sitzung.access_token){
  auffrischen().then(loslegen).catch(function(){ abmelden(); });
}else{
  $('tor').hidden = false;
}
})();
